services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_USER=sa
      - DB_PASSWORD=Roki2006Sql
      - DB_SERVER=sqlserver
      - DB_DATABASE=Ferreteria
      - JWT_SECRET=FerreteriaSecret2026
    depends_on:
        sqlserver:
          # ADVERTENCIA: Si se cambia a service_started el backend puede
          # intentar conectar antes de que SQL Server esté listo.
          condition: service_healthy

  sqlserver:
    # ADVERTENCIA: Cambiar la version de SQL Server puede romper el path
    # del healthcheck (mssql-tools18).
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      # ADVERTENCIA: Este password debe coincidir con DB_PASSWORD del backend
      # y con el password usado en el healthcheck. Si uno cambia sin los otros,
      # la conexion falla.
      - MSSQL_SA_PASSWORD=Roki2006Sql
    healthcheck:
      # ADVERTENCIA: No modificar el path, los flags ni el password sin
      # actualizar los otros dos lugares donde se usa la misma credencial.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Roki2006Sql' -C -Q 'SELECT 1'"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 10
